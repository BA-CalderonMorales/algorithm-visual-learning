<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shell Sort Walkthrough</title>
  <style>
    :root { --bg:#18181b; --panel:#202023; --muted:#2f2f34; --border:#52525b; --text:#f4f4f5; --sub:#a1a1aa; --green:#34d399; --blue:#60a5fa; --orange:#fb923c; --yellow:#facc15; --purple:#c084fc; }
    * { box-sizing:border-box; }
    html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:Arial,sans-serif; }
    #shell-sort { height:100vh; padding:28px 36px; position:relative; }
    h1 { margin:0 0 8px; font-size:clamp(22px,2vw,32px); font-weight:500; }
    .complexity { color:var(--sub); font-size:12px; line-height:1.4; margin:0 0 8px; max-width:900px; }
    .step { color:var(--sub); margin-bottom:18px; }
    .controls { position:absolute; top:24px; right:32px; display:flex; gap:8px; padding:8px; border:1px solid var(--border); border-radius:0; background:#27272a; }
    button { font:inherit; padding:9px 14px; border:1px solid var(--border); border-radius:0; background:#303036; color:var(--text); cursor:pointer; }
    button:hover:not(:disabled) { border-color:var(--blue); background:#3f3f46; }
    button:disabled { opacity:.45; cursor:default; }
    .stage { height:calc(100vh - 220px); min-height:390px; border:1px solid var(--border); background:#1f1f22; overflow-y:auto; overscroll-behavior:contain; scroll-behavior:smooth; padding:22px 24px; scrollbar-width:thin; scrollbar-color:#71717a #27272a; }
    .stage::-webkit-scrollbar { width:12px; }
    .stage::-webkit-scrollbar-track { background:#27272a; border-left:1px solid #3f3f46; }
    .stage::-webkit-scrollbar-thumb { background:#71717a; border:3px solid #27272a; border-radius:0; }
    .stage::-webkit-scrollbar-thumb:hover { background:#a1a1aa; }
    .content { width:min(1450px,100%); margin:0 auto; }
    .message { color:var(--sub); font-size:clamp(15px,1.35vw,20px); line-height:1.4; margin:4px 0 18px; }
    .legend { display:flex; flex-wrap:wrap; gap:8px 18px; margin-bottom:14px; color:var(--sub); font-size:12px; }
    .legend span { display:flex; align-items:center; gap:6px; }
    .swatch { width:12px; height:12px; border:1px solid var(--border); border-radius:0; }
    .history { display:flex; flex-direction:column; gap:8px; }
    .history-row { display:grid; grid-template-columns:80px minmax(250px,auto) minmax(240px,1fr); align-items:center; gap:18px; min-height:62px; padding:12px 14px; border:1px solid transparent; border-radius:0; background:#1c1c20; scroll-margin-block:calc(50vh - 145px); }
    .history-row.current { border-color:var(--blue); background:#22252b; box-shadow:0 0 0 1px #60a5fa33; }
    .history-label { justify-self:center; padding:4px 6px; border:1px solid #3f3f46; border-radius:0; color:var(--sub); text-align:center; font-size:clamp(11px,.8vw,13px); line-height:1.2; white-space:nowrap; }
    .history-array { display:grid; grid-template-columns:repeat(10,minmax(0,1fr)); gap:clamp(2px,.35vw,5px); align-items:center; width:min(100%,390px); min-width:0; padding:4px 7px; border-radius:0; background:#151518; }
    .history-array-stack { width:min(100%,390px); min-width:0; }
    .history-array-stack .history-array { width:100%; }
    .held-key-track { display:grid; grid-template-columns:repeat(10,minmax(0,1fr)); gap:clamp(2px,.35vw,5px); align-items:center; margin-top:4px; }
    .held-key-caption { grid-column:1 / -1; color:var(--sub); font-size:10px; line-height:1.2; }
    .held-key-value { justify-self:center; min-width:24px; padding:2px 4px; border:1px solid var(--blue); background:var(--blue-fill,#24405f); color:#dbeafe; font-size:11px; font-weight:700; text-align:center; }
    .history-position { display:flex; min-width:0; flex-direction:column; align-items:center; gap:3px; }
    .history-index { color:var(--sub); font-size:10px; line-height:1; }
    .pointer-markers { min-height:11px; color:#bfdbfe; font-size:9px; line-height:1; font-weight:700; }
    .history-cell { width:100%; min-width:0; height:32px; display:grid; place-items:center; border:1px solid var(--border); border-radius:0; background:var(--muted); color:var(--text); font-size:15px; }
    .history-position.outside-lane { opacity:.38; }
    .history-position.in-lane { position:relative; z-index:1; padding:3px 2px 1px; outline:1px solid #c084fc; outline-offset:1px; background:#42265f66; }
    .history-position.in-lane .history-index { color:#e9d5ff; font-weight:700; }
    .history-row.current .history-position.in-lane { animation:gap-group-activate 420ms cubic-bezier(.2,.75,.25,1) both; }
    @keyframes gap-group-activate {
      0% { background:#42265f00; outline-color:#c084fc55; box-shadow:0 0 0 0 #c084fc00; transform:scale(.94); }
      48% { background:#42265fcc; outline-color:#e9d5ff; box-shadow:0 0 0 3px #c084fc66; transform:scale(1.035); }
      100% { background:#42265f66; outline-color:#c084fc; box-shadow:0 0 0 1px #c084fc44; transform:scale(1); }
    }
    .history-cell.key { border-color:var(--blue); background:#24405f; }
    .history-cell.compare { border-color:var(--yellow); background:#514616; }
    .history-cell.shift { border-color:var(--orange); background:#493326; }
    .history-cell.inserted { border-color:var(--green); background:#245743; }
    .history-cell.hole { border:1px dashed var(--orange); background:#2a2420; color:#fb923c; }
    .history-reason { color:var(--sub); font-size:13px; line-height:1.5; }
    .history-rule { color:var(--text); font-weight:600; margin-bottom:4px; }
    .history-lane { color:#d8b4fe; font-size:11px; margin-bottom:4px; }
    .history-lane strong { color:#e9d5ff; }
    .history-badges { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:5px; }
    .history-row.current .history-reason { color:var(--text); }
    .gap-pill { color:#e9d5ff; border:1px solid #8b5cf6; border-radius:0; padding:3px 9px; font-size:11px; white-space:nowrap; }
    .key-pill { color:#dbeafe; border-color:var(--blue); background:#24405f; }
    @media(prefers-reduced-motion:reduce) { .history-row.current .history-position.in-lane { animation:none; } }
    @media(max-width:1100px) {
      #shell-sort { padding:20px; }
      .controls { position:static; width:max-content; max-width:100%; flex-wrap:wrap; margin:12px 0; padding:6px; gap:5px; }
      button { padding:7px 9px; font-size:12px; }
      .stage { height:calc(100vh - 255px); min-height:320px; padding:16px 12px; }
      .history-row { grid-template-columns:82px minmax(0,1fr); gap:14px; padding:12px; }
      .history-reason { grid-column:2; margin-top:3px; padding:8px 10px; border:1px solid #3f3f46; border-radius:0; background:#202023; }
      .history-label { grid-row:1 / span 2; align-self:stretch; justify-self:stretch; min-width:0; padding:8px 9px 0 0; border:0; border-right:1px solid #3f3f46; border-radius:0; }
      .history-array { padding:7px 9px; }
      .history-cell { height:28px; font-size:13px; }
    }
    @media(max-width:820px) {
      #shell-sort { padding:14px; }
      .stage { height:calc(100vh - 280px); min-height:270px; }
      .history-row { grid-template-columns:82px minmax(0,1fr); gap:14px; padding:12px; }
      .history-reason { grid-column:2; }
      .history-label { grid-row:1 / span 2; }
    }
    #shell-sort .controls button { width:96px; height:28px; display:inline-flex; align-items:center; justify-content:center; padding:0 4px; font-size:11px; line-height:1; white-space:nowrap; }
    body.embedded { overflow:hidden; }
    body.embedded #shell-sort { height:100dvh; min-height:0; display:grid; grid-template-columns:142px minmax(0,1fr); grid-template-rows:auto minmax(0,1fr); gap:8px 14px; padding:12px; overflow:hidden; }
    body.embedded h1, body.embedded .complexity, body.embedded .message { display:none; }
    body.embedded .step { grid-column:1; grid-row:1; align-self:end; margin:0; font-size:13px; }
    body.embedded .controls { position:static; grid-column:1; grid-row:2; display:flex; flex-direction:column; width:100%; max-width:none; align-self:start; gap:6px; margin:0; padding:7px; }
    body.embedded #shell-sort .controls button { width:100% !important; height:30px; flex:0 0 auto; }
    body.embedded .legend { grid-column:2; grid-row:1; align-self:end; margin:0; padding:4px 8px; border-bottom:1px solid #3f3f46; }
    body.embedded .stage { grid-column:2; grid-row:2; width:100%; height:auto; min-height:0; padding:12px; }
    body.embedded .history-row { grid-template-columns:68px minmax(0,1fr); gap:8px; }
    body.embedded .history-array { min-width:0; }
    body.embedded .history-reason { grid-column:2; }
    body.embedded #shell-sort .controls { width:100% !important; max-width:none; align-self:stretch; border-radius:0; }
    body.embedded #shell-sort .controls button { height:30px; border-radius:0; }
    @media(max-width:600px) { body.embedded #shell-sort { grid-template-columns:112px minmax(0,1fr); gap:7px; padding:8px; } body.embedded .controls { padding:5px; } body.embedded .controls button { font-size:10px; } body.embedded .history-row { grid-template-columns:1fr; } body.embedded .history-reason { grid-column:1; } }
    @media(min-width:1101px) { .history-label { align-self:stretch; display:flex; align-items:center; justify-content:center; padding:8px 12px 8px 0; border:0; border-right:1px solid #3f3f46; border-radius:0; } body.embedded .history-label { grid-row:1 / span 2; } }
  </style>
  <link rel="stylesheet" href="walkthrough-theme.css">
</head>
<body>
<main id="shell-sort">
  <h1>Shell Sort: gap passes, compare, shift, insert</h1>
  <div class="step" id="step">Step 1</div>
  <div class="controls"><button id="back" disabled>Back step</button><button id="next">Next step</button><button id="reset">Reset</button><button id="shuffle">Shuffle same size</button><button id="front-examples">Front examples</button></div>
  <div class="legend" aria-label="Color key and pointers"><span><i class="swatch" style="background:#24405f;border-color:#60a5fa"></i>Held key</span><span><i class="swatch" style="background:#514616;border-color:#facc15"></i>Compared value</span><span><i class="swatch" style="background:#493326;border-color:#fb923c"></i>Shift / · open slot</span><span><i class="swatch" style="background:#245743;border-color:#34d399"></i>Inserted key</span><span><i class="swatch" style="border-color:#c084fc"></i>Active gap-group</span><span><b>i</b> held-key pass · <b>j</b> gap-spaced comparison</span></div>
  <section class="stage" id="stage"><div class="content">
    <div class="message" id="message"></div>
    <div class="history" id="history"></div>
  </div></section>
</main>
<script>if(window.self!==window.top)document.body.classList.add('embedded');</script>
<script src="motion-runtime.js"></script>
<script>
(() => {
  const original = [8,1,4,9,5,3,7,2,6,0];
  const frontExamples = [
    {values:[9,8,7,6,5,4,3,2,1,0],intro:'Front example 1 of 2: At gap 5, key 4 at A[5] compares with A[0] = 9 and jumps straight to index 0. Indices 1–4 are skipped in that comparison.'},
    {values:[9,0,8,7,6,5,4,3,2,1],intro:'Front example 2 of 2: After the gap-2 pass, key 0 is at A[1]. During gap 1 it compares with A[0] = 1, shifts left one spot, and reaches index 0.'}
  ];
  let frontExampleIndex=-1;
  let states=[], step=0;

  function build(values) {
    const a=values.slice(), trace=[];
    const add=(msg,{tags={},gap=null,heldKey=null,keyOrigin=null,lane=null,kind='',from=null,to=null,moving=null,i=null,j=null}={})=>trace.push({a:a.slice(),tags,gap,heldKey,keyOrigin,lane,kind,from,to,moving,i,j,msg});
    add(`Start with the original array. Shell Sort will sort elements that are ${Math.floor(a.length/2)} positions apart, then reduce the gap.`,{gap:Math.floor(a.length/2)});
    for(let gap=Math.floor(a.length/2);gap>0;gap=Math.floor(gap/2)) {
      add(`Begin a gap-${gap} pass. Each index follows only positions ${gap} apart in its own group.`,{gap,kind:'pass-start'});
      for(let i=gap;i<a.length;i++) {
        const key=a[i];
        a[i]=null;
        let j=i;
        const lane=i%gap;
        add(`Hold key ${key} from index ${i}. Its value stays visible in the held-key track below the array while the open slot is shown in the array. Compare it with A[${j-gap}], ${gap} positions to the left in this same group.`,{gap,heldKey:key,keyOrigin:i,lane,kind:'hold',from:j-gap,to:i,i,j:j-gap,tags:{[i]:'key',[j-gap]:'compare'}});
        while(j>=gap && a[j-gap]>key) {
          const from=j-gap, moving=a[from];
          a[j]=moving;
          a[from]=null;
          add(`${moving} is greater than held key ${key}. Shift ${moving} from index ${from} to index ${j}; the open position moves left to index ${from}. The held key remains visible below at its original index ${i}.`,{gap,heldKey:key,keyOrigin:i,lane,kind:'shift',from,to:j,moving,i,j:from,tags:{[from]:'hole',[j]:'shift'}});
          j=from;
          if(j>=gap) add(`Stay in this gap-group. Compare held key ${key} with A[${j-gap}] next; it is ${gap} positions left of the open slot. The held key is still shown below at its original index ${i}.`,{gap,heldKey:key,keyOrigin:i,lane,kind:'continue',from:j-gap,to:j,i,j:j-gap,tags:{[j]:'hole',[j-gap]:'compare'}});
        }
        if(j>=gap) add(`A[${j-gap}] = ${a[j-gap]} is not greater than held key ${key}. Stop shifting; the key belongs in the open slot at index ${j}.`,{gap,heldKey:key,lane,kind:'stop',from:j-gap,to:j,i,j:j-gap,tags:{[j-gap]:'compare',[j]:'hole'}});
        else add(`No earlier index exists in this gap-group. Put held key ${key} into the open slot at index ${j}.`,{gap,heldKey:key,lane,kind:'first',to:j,i,j:null,tags:{[j]:'hole'}});
        a[j]=key;
        add(`Insert key ${key} at index ${j}. This gap-group is in order for the positions checked so far.`,{gap,lane,kind:'insert',to:j,moving:key,i,j:j>=gap?j-gap:null,tags:{[j]:'inserted'}});
      }
      add(`Gap-${gap} pass complete. Reduce the gap and sort the interleaved groups again.`,{gap});
    }
    add('Gap 1 is complete, so the entire array is sorted.',{tags:Object.fromEntries(a.map((_,i)=>[i,'inserted']))});
    return trace;
  }

  function render() {
    const state=states[step];
    document.getElementById('step').textContent=`Step ${step+1} of ${states.length}`;
    document.getElementById('message').textContent=state.msg;
    const history=document.getElementById('history'); history.replaceChildren();
    states.slice(0,step+1).forEach((item,index)=>{
      const row=document.createElement('article'); row.className='history-row'+(index===step?' current':'');
      const label=document.createElement('div'); label.className='history-label'; label.textContent=`Step ${index+1}`;
      const arrayStack=document.createElement('div'); arrayStack.className='history-array-stack';
      const values=document.createElement('div'); values.className='history-array';
      item.a.forEach((value,i)=>{
        const position=document.createElement('div');
        position.className='history-position'+(item.lane===null?'':(i%item.gap===item.lane?' in-lane':' outside-lane'));
        const cell=document.createElement('div'); const tag=item.tags?.[i]||''; cell.className=`history-cell ${tag}`; cell.textContent=value===null?'·':value;
        const indexLabel=document.createElement('span'); indexLabel.className='history-index'; indexLabel.textContent=i;
        const marker=document.createElement('span');marker.className='pointer-markers';marker.textContent=[item.i===i?'i':'',item.j===i?'j':''].filter(Boolean).join(' · ');
        position.append(cell,indexLabel,marker); values.appendChild(position);
      });
      arrayStack.appendChild(values);
      if(item.heldKey!==null && item.keyOrigin!==null){
        const keyTrack=document.createElement('div'); keyTrack.className='held-key-track';
        const caption=document.createElement('span'); caption.className='held-key-caption'; caption.textContent='Held key remains visible here (tracked from its original index):';
        const keyValue=document.createElement('span'); keyValue.className='held-key-value'; keyValue.style.gridColumn=String(item.keyOrigin+1); keyValue.textContent=item.heldKey; keyValue.title=`Held key ${item.heldKey}, originally at index ${item.keyOrigin}`;
        keyTrack.append(caption,keyValue); arrayStack.appendChild(keyTrack);
      }
      const reason=document.createElement('div'); reason.className='history-reason';
      const badges=document.createElement('div'); badges.className='history-badges';
      if(item.gap!==null){const pill=document.createElement('span');pill.className='gap-pill';pill.textContent=`gap ${item.gap}`;badges.appendChild(pill);}
      if(item.heldKey!==null){const held=document.createElement('span');held.className='gap-pill key-pill';held.textContent=`held key ${item.heldKey} · from index ${item.keyOrigin}`;badges.appendChild(held);}
      if(badges.childElementCount)reason.appendChild(badges);
      const rules={
        hold:`Compare A[${item.from}] = ${item.a[item.from]} with held key ${item.heldKey}`,
        shift:`${item.moving} > ${item.heldKey}  →  move ${item.moving}: A[${item.from}] → A[${item.to}]`,
        continue:`Next compare: A[${item.from}] = ${item.a[item.from]} versus key ${item.heldKey}`,
        stop:`${item.a[item.from]} ≤ ${item.heldKey}  →  insert at A[${item.to}]`,
        first:`No earlier index in this group  →  insert at A[${item.to}]`,
        insert:`A[${item.to}] ← ${item.moving}`
      };
      if(rules[item.kind]){const rule=document.createElement('div');rule.className='history-rule';rule.textContent=rules[item.kind];reason.appendChild(rule);}
      if(item.gap!==null){
        const lane=document.createElement('div');lane.className='history-lane';
        if(item.lane!==null){
          const indices=[];for(let i=item.lane;i<item.a.length;i+=item.gap)indices.push(i);
          lane.textContent=`Active gap-group indices: ${indices.join(' → ')}`;
        } else if(item.kind==='pass-start') {
          const groups=[];for(let start=0;start<item.gap;start++){const indices=[];for(let i=start;i<item.a.length;i+=item.gap)indices.push(i);groups.push(indices.join(' → '));}
          lane.textContent=`Groups for this pass: ${groups.join('   |   ')}`;
        }
        if(lane.textContent)reason.appendChild(lane);
      }
      const explanation=document.createElement('div');explanation.textContent=item.msg;reason.appendChild(explanation);
      row.append(label,arrayStack,reason); history.appendChild(row);
    });
    document.getElementById('back').disabled=step===0;
    document.getElementById('next').disabled=step===states.length-1;
    const active=history.querySelector('.history-row.current');
    const stage=document.querySelector('.stage');if(active&&stage)requestAnimationFrame(()=>{const stageRect=stage.getBoundingClientRect(),rowRect=active.getBoundingClientRect();const target=stage.scrollTop+rowRect.top-stageRect.top-(stage.clientHeight-active.offsetHeight)/2;stage.scrollTop=Math.max(0,Math.min(target,stage.scrollHeight-stage.clientHeight));});
  }
  function reset(values=original){states=build(values);step=0;render();}
  document.getElementById('back').onclick=()=>{if(step>0){step--;render();}};
  document.getElementById('next').onclick=()=>{if(step<states.length-1){step++;render();}};
  document.getElementById('reset').onclick=()=>reset();
  document.getElementById('shuffle').onclick=()=>{const values=Array.from({length:10},(_,i)=>i);for(let i=values.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[values[i],values[j]]=[values[j],values[i]];}reset(values);};
  document.getElementById('front-examples').onclick=()=>{
    frontExampleIndex=(frontExampleIndex+1)%frontExamples.length;
    const example=frontExamples[frontExampleIndex];
    reset(example.values);
    states[0].msg=example.intro;
    render();
  };
  reset();
})();
</script>
</body>
</html>
