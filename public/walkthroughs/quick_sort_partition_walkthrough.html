            const markerCell = document.createElement('span');
            markerCell.className = 'history-index history-pointer';
            markerCell.textContent = [pointers.i === valueIndex ? 'i' : '', pointers.j === valueIndex ? 'j' : ''].filter(Boolean).join(' · ');
            markersRow.appendChild(markerCell);
          });
          mini.append(valuesRow, indicesRow, markersRow);
          row.append(label, mini, description);
          history.appendChild(row);
        });
        const el = document.getElementById('qs-array');
        el.replaceChildren();
        s.a.forEach((value, index) => {
          const item = document.createElement('div');
          item.className = 'item';
          if (s.tags && s.tags[index] === 'pivot') item.classList.add('pivot');
          if (s.focus && s.focus.includes(index)) item.classList.add('focus');
          if (s.swap && s.swap.includes(index)) item.classList.add('swap');
          if (pivotIndex !== undefined && /insertion sort/i.test(s.msg)) {
            if (index === Number(pivotIndex)) item.classList.add('context-pivot');
            else if (index < Number(pivotIndex)) item.classList.add('insertion-range');
            else item.classList.add('s2-range');
          }
          const pointers = s.markers || Object.fromEntries(Object.entries(s.tags || {}).filter(([, tag]) => tag === 'i' || tag === 'j').map(([pointerIndex, tag]) => [tag, Number(pointerIndex)]));
          item.innerHTML = `<div class="tag">${s.tags && s.tags[index] ? s.tags[index] : ''}</div><div class="box">${value}</div><div class="index">${index}</div><div class="item-pointer">${[pointers.i === index ? 'i' : '', pointers.j === index ? 'j' : ''].filter(Boolean).join(' · ')}</div>`;
          el.appendChild(item);
        });
        document.getElementById('qs-next').disabled = step === states.length - 1;
        document.getElementById('qs-back').disabled = step === 0;
        requestAnimationFrame(() => {
          const stage = document.querySelector('.study-stage');
          const currentRow = history.querySelector('.history-row.current');
          if (!stage || !currentRow) return;
          const stageBounds = stage.getBoundingClientRect();
          const rowBounds = currentRow.getBoundingClientRect();
          const desiredTop = stage.scrollTop + rowBounds.top - stageBounds.top - (stage.clientHeight - currentRow.offsetHeight) / 2;
          stage.scrollTop = Math.max(0, Math.min(desiredTop, stage.scrollHeight - stage.clientHeight));
        });
      }
      document.getElementById('qs-back').addEventListener('click', () => { if (step > 0) { step -= 1; render(); } });
      document.getElementById('qs-next').addEventListener('click', () => { if (step < states.length - 1) { step += 1; render(); } });
      document.getElementById('qs-reset').addEventListener('click', () => { step = 0; render(); });
      document.getElementById('qs-shuffle').addEventListener('click', () => {
        const values = Array.from({length: 10}, (_, index) => index);
        for (let index = values.length - 1; index > 0; index--) {
          const swapIndex = Math.floor(Math.random() * (index + 1));
          [values[index], values[swapIndex]] = [values[swapIndex], values[index]];
        }
        states = buildTrace(values);
        step = 0;
        render();
      });
      document.querySelectorAll('[data-preset]').forEach((button) => button.addEventListener('click', (event) => {
        states = buildTrace(JSON.parse(event.currentTarget.dataset.preset));
        step = 0;
        render();
        event.currentTarget.closest('details').open = false;
      }));
      render();
    })();
  </script>
</div>
