name: Build and publish Sorting Walkthroughs

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Verify source boundaries and formatting
        run: npm run test:architecture && npm run format:check
      - name: Verify film cache behavior
        run: npm run test:film-cache
      - name: Verify implementation examples and canonical source copies
        run: npm run test:implementation-models
      - name: Fingerprint exported films
        id: film_inputs
        run: echo "key=$(node scripts/render-films.mjs --cache-key)" >> "$GITHUB_OUTPUT"
      - name: Restore exported films
        uses: actions/cache/restore@v4
        with:
          path: public/films
          key: films-v1-${{ runner.os }}-${{ steps.film_inputs.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            films-v1-${{ runner.os }}-${{ steps.film_inputs.outputs.key }}-
            films-v1-${{ runner.os }}-
      - name: Install browser for walkthrough checks and film rendering
        run: npx playwright install --with-deps chromium
      - name: Start the app for film rendering
        run: nohup npm run dev -- --host 127.0.0.1 --port 5175 > /tmp/dsa-vite.log 2>&1 < /dev/null &
      - name: Verify responsive app interactions
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5175/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5175/ > /dev/null
          npm run test:architecture-ui
          npm run test:navigation
          npm run test:domain-landings
          npm run test:study
          npm run test:problems
      - name: Render only missing or changed films
        id: render_films
        run: npm run render:films
      - name: Build static site
        run: npm run build
      - name: Verify interactive walkthroughs
        run: npm run test:walkthroughs && npm run test:implementations
      - name: Save verified exported films
        if: steps.render_films.outputs.rendered != '0'
        uses: actions/cache/save@v4
        with:
          path: public/films
          key: films-v1-${{ runner.os }}-${{ steps.film_inputs.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
