name: Build and publish Sorting Walkthroughs

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Install browser for walkthrough checks and film rendering
        run: npx playwright install --with-deps chromium
      - name: Start the app for film rendering
        run: nohup npm run dev -- --host 127.0.0.1 --port 5175 > /tmp/dsa-vite.log 2>&1 < /dev/null &
      - name: Render the algorithm and concept films
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5175/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5175/ > /dev/null
          npm run render:films
      - name: Build static site
        run: npm run build
      - name: Verify interactive walkthroughs
        run: npm run test:walkthroughs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
